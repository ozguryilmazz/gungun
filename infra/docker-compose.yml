# Lokal geliştirme altyapısı — YALNIZCA geliştirme içindir, production'da kullanılmaz.
# Kök dizinden çalıştır: pnpm db:up  (değerleri kökteki .env dosyasından okur)
name: gundemci

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env dosyasında tanımlı olmalı}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env dosyasında tanımlı olmalı}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    ports:
      # Yalnızca bu bilgisayardan erişilebilir; ağdaki diğer cihazlara açılmaz
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
